[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Evaluation and regression gating for LLM agents: YAML suites, adapters, deterministic + LLM-judge scoring, SQLite results, Streamlit dashboard."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pyyaml>=6", "pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2"]
dev = ["pytest>=8"]

[project.scripts]
aeh = "aeh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
